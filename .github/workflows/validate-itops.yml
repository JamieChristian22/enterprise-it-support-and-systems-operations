name: Validate synthetic IT operations and safe script syntax

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  datasets:
    name: Synthetic ticket reconciliation and offline console (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11','3.12']
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify Python source syntax
        run: python -m compileall -q tools tests
      - name: Parse offline dashboard JavaScript without executing it
        run: python tools/check_inline_js.py demo/it-operations-console.html
      - name: Reconcile synthetic helpdesk tickets, user references and independent monthly KPIs
        run: python -m tools.validate_itops --output reports/itops-source-validation.json
      - name: Run regression and source-backed interactive UI tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Upload reproducible offline evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: itops-python-${{ matrix.python-version }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            reports/itops-source-validation.json
            demo/it-operations-console.html

  script-syntax:
    name: Safe PowerShell and Bash syntax review (never execute admin scripts)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Syntax-check scoped Help Desk, IT Operations and Outlook PowerShell scripts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $paths = @(
            'enterprise-helpdesk-support-lab/scripts/powershell',
            'enterprise-it-operations-lab/scripts/powershell',
            'enterprise-microsoft-365-outlook-support-lab/scripts'
          )
          $files = @($paths | ForEach-Object { Get-ChildItem -LiteralPath $_ -Recurse -File -Include *.ps1,*.psm1 })
          if ($files.Count -lt 25) { throw "Expected at least 25 PowerShell scripts; found $($files.Count)" }
          $issues = @()
          foreach ($file in $files) {
            $tokens = $null
            $parseErrors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($file.FullName,[ref]$tokens,[ref]$parseErrors)
            foreach ($problem in $parseErrors) {
              $issues += "$($file.FullName):$($problem.Extent.StartLineNumber): $($problem.Message)"
            }
          }
          Write-Host "PowerShell syntax-parsed $($files.Count) files; failures=$($issues.Count)"
          if ($issues.Count) { $issues | ForEach-Object { Write-Error $_ }; exit 1 }
      - name: Check Bash script syntax only; do not invoke admin commands
        run: |
          set -euo pipefail
          count=0
          while IFS= read -r -d '' file; do
            bash -n "$file"
            count=$((count+1))
          done < <(find enterprise-it-operations-lab/scripts enterprise-helpdesk-support-lab/scripts -type f -name '*.sh' -print0)
          test "$count" -gt 0
          echo "PASS: Bash syntax checked for $count scripts. No host administration performed."

  browser-smoke:
    name: Offline interactive dashboard browser smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install pinned Chromium browser
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Test dashboard interactions and mobile layout
        run: python tools/smoke_demo.py
      - name: Upload preview screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: interactive-browser-smoke
          if-no-files-found: warn
          retention-days: 14
          path: |
            reports/*-desktop.png
            reports/*-mobile.png

  secrets:
    name: Full-history Gitleaks secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify Gitleaks binary download
        run: |
          curl --fail --location --retry 3 --silent --show-error \
            https://github.com/gitleaks/gitleaks/releases/download/v8.24.2/gitleaks_8.24.2_linux_x64.tar.gz \
            -o /tmp/gitleaks.tar.gz
          echo 'fa0500f6b7e41d28791ebc680f5dd9899cd42b58629218a5f041efa899151a8e  /tmp/gitleaks.tar.gz' | sha256sum --check
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          chmod +x /tmp/gitleaks
      - name: Scan committed Git history
        run: /tmp/gitleaks git --no-banner --redact .
